<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pansiyon Yoklama</title>
<style>body{font:16px system-ui;margin:auto;max-width:760px;padding:24px;background:#f5f7fb;color:#182235}h1{margin-bottom:4px}.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #18223512}.status{font-size:20px;font-weight:700;color:#146c43}label{display:block;margin-top:11px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #c8d0dc;border-radius:8px;margin-top:4px}button,a{display:inline-block;margin-top:14px;padding:10px 14px;border:0;border-radius:8px;background:#155eef;color:white;text-decoration:none;font-weight:600}small{color:#607086}</style></head>
<body><h1>Pansiyon Yoklama</h1><small>RFID kart ile giriş yoklaması</small>
<section class="card"><div id="message" class="status">Bağlanıyor…</div><div id="detail"></div><small id="clock"></small></section>
<section class="card"><h2>Öğrenci kartı tanımla</h2><small>RFID okutucunun Seri Monitör çıktısındaki UID değerini girin.</small><form id="student"><label>Kart UID<input name="uid" placeholder="A1B2C3D4" required></label><label>Öğrenci numarası<input name="number" required></label><label>Ad soyad<input name="name" required></label><label>Oda<input name="room"></label><button>Kaydet</button></form><div id="result"></div></section>
<section class="card"><h2>Rapor</h2><a id="download" href="/api/attendance" download="yoklama.csv">Bugünkü yoklamayı indir</a></section>
<script>async function status(){try{let s=await fetch('/api/status').then(r=>r.json());message.textContent=s.message;detail.textContent=s.student?`Son işlem: ${s.student}`:'';clock.textContent=`${s.date} · ${s.ip} · SD kart: ${s.sdReady?'hazır':'hata'}`}catch(e){message.textContent='Sunucuya ulaşılamıyor'}}status();setInterval(status,3000);student.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(student));let r=await fetch('/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});result.textContent=r.ok?'Kart tanımlandı.':'Kayıt başarısız.';if(r.ok)student.reset()}</script></body></html>
